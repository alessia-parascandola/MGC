plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'it.unicam.cs.mpgc.rpg126692'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}
application {
    mainClass = 'it.unicam.cs.mpgc.rpg126692.gui.MainGUI'
}

run {
    standardInput = System.in
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        if (!project.hasProperty("guiTest")) excludeTags "gui"
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('runConsole', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'it.unicam.cs.mpgc.rpg126692.Main'
    standardInput = System.in
}
